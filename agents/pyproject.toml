[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zkroute-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "web3>=6.15.0",
    "eth-account>=0.11.0",
    "pynacl>=1.5.0",          # signal encryption (NaCl box)
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "asyncio-throttle>=1.0.2",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.ruff]
line-length = 100
